name: Build Image and Push

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and publish
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: build-image-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.vars.outputs.ref }}
      version: ${{ steps.vars.outputs.version }}
      major: ${{ steps.vars.outputs.major }}
      major_minor: ${{ steps.vars.outputs.major_minor }}
      image: ${{ steps.vars.outputs.image }}
    steps:
      - name: Resolve tag and image name
        id: vars
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ref="${INPUT_TAG:-$REF_NAME}"

          if [ -z "$ref" ]; then
            echo "Unable to determine tag to build" >&2
            exit 1
          fi

          case "$ref" in
            v*) ;;
            *)
              echo "Tag must start with 'v'" >&2
              exit 1
              ;;
          esac

          version="${ref#v}"
          major="${version%%.*}"
          rest="${version#*.}"
          major_minor="${major}.${rest%%.*}"
          image="$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major_minor" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ${{ matrix.runner }}
    needs: prepare
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Prepare platform pair
        run: |
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.ref }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-24.04
    needs:
      - prepare
      - build
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image }}
          VERSION_TAG: ${{ needs.prepare.outputs.version }}
          MAJOR_TAG: ${{ needs.prepare.outputs.major }}
          MAJOR_MINOR_TAG: ${{ needs.prepare.outputs.major_minor }}
        run: |
          sources=""
          for digest in *; do
            sources="$sources ${IMAGE}@sha256:${digest}"
          done

          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION_TAG}" \
            -t "${IMAGE}:${MAJOR_MINOR_TAG}" \
            -t "${IMAGE}:${MAJOR_TAG}" \
            ${sources}

      - name: Inspect image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image }}
          VERSION_TAG: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION_TAG}"

      - name: Wait for registry tags to settle
        run: sleep 30

      - name: Delete untagged container versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ needs.prepare.outputs.image }}
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 1
