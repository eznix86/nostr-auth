name: Build Image Manual

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and publish
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve tag and image name
        id: vars
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ref="$INPUT_TAG"

          case "$ref" in
            v*) ;;
            *)
              echo "Tag must start with 'v'" >&2
              exit 1
              ;;
          esac

          version="${ref#v}"
          major="${version%%.*}"
          rest="${version#*.}"
          major_minor="${major}.${rest%%.*}"
          image="$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major_minor" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.ref }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.major_minor }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.major }}
