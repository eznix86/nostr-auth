events {}

http {
  server {
    listen 80;
    server_name _;

    location = /_auth {
      internal;
      proxy_pass http://host.docker.internal:3000/auth/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Accept "application/json";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Uri $request_uri;
    }

    location / {
      auth_request /_auth;
      
      # Pass auth headers to upstream
      auth_request_set $user $upstream_http_remote_user;
      auth_request_set $email $upstream_http_x_auth_request_email;
      auth_request_set $groups $upstream_http_x_auth_request_groups;
      auth_request_set $preferred_username $upstream_http_x_auth_request_preferred_username;
      auth_request_set $name $upstream_http_x_auth_request_name;
      auth_request_set $picture $upstream_http_x_auth_request_picture;
      
      proxy_set_header Remote-User $user;
      proxy_set_header X-Forwarded-User $user;
      proxy_set_header X-Auth-Request-User $user;
      proxy_set_header X-Auth-Request-Email $email;
      proxy_set_header X-Forwarded-Groups $groups;
      proxy_set_header X-Auth-Request-Groups $groups;
      proxy_set_header X-Auth-Request-Preferred-Username $preferred_username;
      proxy_set_header X-Auth-Request-Name $name;
      proxy_set_header X-Auth-Request-Picture $picture;
      
      error_page 401 = @login;
      proxy_pass http://host.docker.internal:8080;
    }

    location @login {
      return 302 http://localhost:3000/?redirect=$scheme://$http_host$request_uri;
    }
  }
}
