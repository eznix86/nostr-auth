<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link
            rel="preload"
            as="image"
            href="{{ vite "resources/images/background.jpg" }}"
        />

        <script>
            (function () {
                const storedTheme =
                    window.localStorage.getItem("nostr-auth-theme");
                const theme =
                    storedTheme === "light" || storedTheme === "dark"
                        ? storedTheme
                        : window.matchMedia("(prefers-color-scheme: dark)")
                                .matches
                          ? "dark"
                          : "light";

                document.documentElement.classList.toggle(
                    "dark",
                    theme === "dark",
                );
                document.documentElement.classList.toggle(
                    "light",
                    theme === "light",
                );
            })();
        </script>
        {{ .inertiaHead }}
        {{ viteReactRefresh }}
        {{ viteAssets }}

    </head>
    <body>
        {{ .inertia }}
    </body>
</html>
